# Bundled NBER-style cycle calendar (recession vs expansion).
# Offline copy of commonly cited NBER peak–trough windows.
# Prefer `marketlab regimes --fetcher nber` to refresh from FRED USREC when online.
#
# Descriptive research only. Recessions coincide with many other shocks.

